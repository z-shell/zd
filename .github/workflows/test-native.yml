name: "ZUnit (native)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "docker/utils.zsh"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      zi_repo:
        description: "GitHub repo for zi (owner/name). Leave empty to use the default install script."
        required: false
        default: ""
      zi_ref:
        description: "Branch, tag, or full commit SHA of zi to test."
        required: false
        default: "main"
      include_compat:
        description: "Run the promotion-specific Zi compatibility suite."
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      zi_repo:
        description: "GitHub repo for zi (owner/name). Leave empty to use the default install script."
        type: string
        required: false
        default: ""
      zi_ref:
        description: "Branch, tag, or full commit SHA of zi to test."
        type: string
        required: false
        default: "main"
      include_compat:
        description: "Run the promotion-specific Zi compatibility suite."
        type: boolean
        required: false
        default: false

jobs:
  zunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(inputs.include_compat && '["annexes","compat","ice","packages","plugins","shell-state","snippets","utils"]' || '["annexes","ice","packages","plugins","shell-state","snippets","utils"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zd
          ref: ${{ job.workflow_sha }}

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh

      - name: Install zunit
        run: |
          mkdir -p bin
          curl -fsSL 'https://raw.githubusercontent.com/z-shell/src/9335c8c14e0aaa845277f882969c146755e1241e/lib/zsh/snippets/revolver' > bin/revolver
          curl -fsSL 'https://raw.githubusercontent.com/z-shell/src/9335c8c14e0aaa845277f882969c146755e1241e/lib/zsh/snippets/color.zsh' > bin/color
          # ZUnit 0.8.2 as released (bce183c). z-shell/zunit's own v0.8.2 tag
          # re-evaluates run arguments, which tests/helpers.zsh does not expect yet.
          git init zunit.git
          git -C zunit.git remote add origin https://github.com/z-shell/zunit.git
          git -C zunit.git fetch --depth 1 origin bce183c39a3b51a3dd838835516a37222aad921f
          git -C zunit.git checkout --detach FETCH_HEAD
          cd zunit.git && ./build.zsh && cd ..
          mv zunit.git/zunit bin/
          chmod u+x bin/{color,revolver,zunit}

      - name: Install zi
        env:
          ZI_REPO: ${{ inputs.zi_repo || 'z-shell/zi' }}
          ZI_REF: ${{ inputs.zi_ref || 'main' }}
        run: |
          zi_home="${XDG_DATA_HOME:-${HOME}/.local/share}/zi"
          zi_bin="${zi_home}/bin"
          mkdir -p "${zi_home}"
          git init "${zi_bin}"
          git -C "${zi_bin}" remote add origin "https://github.com/${ZI_REPO}.git"
          git -C "${zi_bin}" fetch --no-tags --depth 1 origin -- "${ZI_REF}"
          git -C "${zi_bin}" checkout --detach FETCH_HEAD
          if [[ "${ZI_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            requested_sha="$(printf '%s' "${ZI_REF}" | tr '[:upper:]' '[:lower:]')"
            [[ "$(git -C "${zi_bin}" rev-parse HEAD)" == "${requested_sha}" ]] || {
              echo "Resolved Zi commit does not match requested SHA: ${ZI_REF}"
              exit 1
            }
          fi
          mkdir -p "${zi_home}"/{cache,completions,plugins,snippets}
          [[ -f "${zi_bin}/zi.zsh" ]] || { echo "zi.zsh not found after install"; exit 1; }

      - name: "ZUnit: ${{ matrix.file }}"
        run: |
          export PATH="$PWD/bin:$PATH"
          export TERM=xterm
          export ZI_BIN="${XDG_DATA_HOME:-${HOME}/.local/share}/zi/bin"
          export ZI_DATA="${RUNNER_TEMP}/zunit"
          zunit --tap --verbose "tests/${{ matrix.file }}.zunit"
