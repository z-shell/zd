name: "ZUnit (native)"

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "utils.zsh"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      zi_repo:
        description: "GitHub repo for zi (owner/name). Leave empty to use the default install script."
        required: false
        default: ""
      zi_ref:
        description: "Branch, tag, or SHA of zi to test."
        required: false
        default: "main"
  workflow_call:
    inputs:
      zi_repo:
        description: "GitHub repo for zi (owner/name). Leave empty to use the default install script."
        type: string
        required: false
        default: ""
      zi_ref:
        description: "Branch, tag, or SHA of zi to test."
        type: string
        required: false
        default: "main"

jobs:
  zunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [annexes, ice, packages, plugins, snippets]
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh

      - name: Install zunit
        run: |
          mkdir -p bin
          curl -fsSL 'https://raw.githubusercontent.com/zdharma/revolver/v0.2.4/revolver' > bin/revolver
          curl -fsSL 'https://raw.githubusercontent.com/zdharma/color/d8f91ab5fcfceb623ae45d3333ad0e543775549c/color.zsh' > bin/color
          git clone --depth 1 https://github.com/zdharma/zunit.git zunit.git
          cd zunit.git && ./build.zsh && cd ..
          mv zunit.git/zunit bin/
          chmod u+x bin/{color,revolver,zunit}

      - name: Install zi
        env:
          ZI_REPO: ${{ inputs.zi_repo }}
          ZI_REF: ${{ inputs.zi_ref }}
        run: |
          if [[ -n "$ZI_REPO" ]]; then
            git clone --depth 1 --branch "${ZI_REF:-main}" \
              "https://github.com/${ZI_REPO}.git" "${HOME}/.zi/bin"
            mkdir -p "${HOME}/.zi"/{cache,completions,plugins,snippets}
          else
            zsh -c "$(curl -fsSL https://install.zshell.dev)" -- -i skip
          fi

      - name: "ZUnit: ${{ matrix.file }}"
        run: |
          export PATH="$PWD/bin:$PATH"
          export TERM=xterm
          export ZI_BIN="${HOME}/.zi/bin"
          export ZI_DATA="${RUNNER_TEMP}/zunit"
          zunit --tap --verbose "tests/${{ matrix.file }}.zunit"
