name: "ZUnit (native)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "utils.zsh"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      zi_repo:
        description: "GitHub repo for zi (owner/name). Leave empty to use the default install script."
        required: false
        default: ""
      zi_ref:
        description: "Branch, tag, or full commit SHA of zi to test."
        required: false
        default: "main"
  workflow_call:
    inputs:
      zi_repo:
        description: "GitHub repo for zi (owner/name). Leave empty to use the default install script."
        type: string
        required: false
        default: ""
      zi_ref:
        description: "Branch, tag, or full commit SHA of zi to test."
        type: string
        required: false
        default: "main"

jobs:
  zunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [annexes, compat, ice, packages, plugins, snippets]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: z-shell/zd
          ref: ${{ job.workflow_sha }}

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -yq zsh

      - name: Install zunit
        run: |
          mkdir -p bin
          curl -fsSL 'https://raw.githubusercontent.com/zdharma/revolver/v0.2.4/revolver' > bin/revolver
          curl -fsSL 'https://raw.githubusercontent.com/zdharma/color/d8f91ab5fcfceb623ae45d3333ad0e543775549c/color.zsh' > bin/color
          git clone --depth 1 --branch v0.8.2 https://github.com/zdharma/zunit.git zunit.git
          cd zunit.git && ./build.zsh && cd ..
          mv zunit.git/zunit bin/
          chmod u+x bin/{color,revolver,zunit}

      - name: Install zi
        env:
          ZI_REPO: ${{ inputs.zi_repo || 'z-shell/zi' }}
          ZI_REF: ${{ inputs.zi_ref || 'main' }}
        run: |
          zi_home="${XDG_DATA_HOME:-${HOME}/.local/share}/zi"
          zi_bin="${zi_home}/bin"
          mkdir -p "${zi_home}"
          git init "${zi_bin}"
          git -C "${zi_bin}" remote add origin "https://github.com/${ZI_REPO}.git"
          git -C "${zi_bin}" fetch --no-tags --depth 1 origin -- "${ZI_REF}"
          git -C "${zi_bin}" checkout --detach FETCH_HEAD
          if [[ "${ZI_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            requested_sha="$(printf '%s' "${ZI_REF}" | tr '[:upper:]' '[:lower:]')"
            [[ "$(git -C "${zi_bin}" rev-parse HEAD)" == "${requested_sha}" ]] || {
              echo "Resolved Zi commit does not match requested SHA: ${ZI_REF}"
              exit 1
            }
          fi
          mkdir -p "${zi_home}"/{cache,completions,plugins,snippets}
          [[ -f "${zi_bin}/zi.zsh" ]] || { echo "zi.zsh not found after install"; exit 1; }

      - name: "ZUnit: ${{ matrix.file }}"
        run: |
          export PATH="$PWD/bin:$PATH"
          export TERM=xterm
          export ZI_BIN="${XDG_DATA_HOME:-${HOME}/.local/share}/zi/bin"
          export ZI_DATA="${RUNNER_TEMP}/zunit"
          zunit --tap --verbose "tests/${{ matrix.file }}.zunit"
