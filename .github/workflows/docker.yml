---
name: "🐋 Zi Docker"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 03 * * 3"
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "docker/**"
      - "scripts/**"
      - "tests/**"
      - "lib/**"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-versioned:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { zsh_version: "5.5.1", alpine_version: "3.9" }
          - { zsh_version: "5.6.2", alpine_version: "3.10" }
          - { zsh_version: "5.7.1", alpine_version: "3.11" }
          - { zsh_version: "5.8", alpine_version: "3.14" }
          - { zsh_version: "5.8.1", alpine_version: "3.16" }
          - { zsh_version: "5.9", alpine_version: "3.19" }
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build_zsh_versions
        uses: docker/build-push-action@v7
        timeout-minutes: 60
        with:
          push: ${{ github.event.number == 0 }}
          file: ./docker/Dockerfile
          context: .
          build-args: ALPINE_VERSION=${{ matrix.alpine_version }}
          tags: ghcr.io/${{ github.repository }}:zsh-${{ matrix.zsh_version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build_latest
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          push: true
          file: ./docker/Dockerfile
          context: .
          tags: ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
