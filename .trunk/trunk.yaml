version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.0
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - checkov
    - terrascan
    - yamllint
    - trivy
    - trufflehog
  enabled:
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.30.1
    - hadolint@2.14.0
    - markdownlint@0.48.0
    - prettier@3.8.3
    - shellcheck@0.11.0
    - shfmt@3.6.0
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
